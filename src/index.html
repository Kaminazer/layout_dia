<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Air</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <link
      rel="shortcut icon"
      href="./air-favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container">
        <div class="header__top">
          <div class="container header__top-container">
            <a href="#" class="header__logo">
              <img
                class="logo"
                src="./images/logo/air-logo.svg"
                alt="Air Logo"
              />
            </a>
            <nav class="nav header__nav">
              <ul class="nav__list">
                <li class="nav__item">
                  <a class="nav__link"href="#about-us">About Us</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link"href="#services">Services</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link"href="#testimonials">Testimonials</a>
                </li>
                <li class="nav__item">
                  <a class="nav__link"href="#contact-us">Contact Us</a>
                </li>
              </ul>
            </nav>

            <button class="header__burger">
              <span class="header__burger-line header__burger-line--top"></span>
              <span class="header__burger-line header__burger-line--bottom"></span>
            </button>
            <a
              href="#"
              class="header__hire-link"
            >
              Hire Us
            </a>
          </div>
        </div>
        <div class="header__container">
          <div class="header__content">
            <h1 class="header__title">Strategic Agency</h1>
            <p class="header__subtitle">
              We believe in the power of bold ideas that can solve business challenges.
            </p>
            <a href="#" class="header__cta button">Learn More</a>
          </div>
          <div class="header__slider slider">
            <!-- Slider main container -->
            <div class="swiper">
              <!-- Additional required wrapper -->
              <div class="swiper-wrapper">
                <!-- Slides -->
                <div class="swiper-slide slider__item">
                  <img
                    src="./images/slider/slide-1.png"
                    alt="Slide 1"
                    class="slider__image"
                  />
                </div>
                <div class="swiper-slide slider__item">
                  <img
                    src="./images/slider/slide-2.png"
                    alt="Slide 2"
                    class="slider__image"
                  />
                </div>
                <div class="swiper-slide slider__item">
                  <img
                    src="./images/slider/slide-3.png"
                    alt="Slide 3"
                    class="slider__image"
                  />
                </div>
              </div>

              <!-- If we need navigation buttons -->
              <div class="slider__navigation slider__navigation--prev">
                <img
                  class="slider__arrow slider__arrow--prev"
                  src="./images/slider/arrow-left.svg"
                  alt="Previous Slide">
              </div>
              <div class="slider__navigation slider__navigation--next">
                <img
                  class="slider__arrow slider__arrow--next"
                  src="./images/slider/arrow-right.svg"
                  alt="Next Slide">
              </div>
              <p class="slider__slide-text">By the same illusion which lifts the horizon.</p>
            </div>
          </div>
        </div>
      </div>

      <aside class="header__mobile-sidebar">
        <nav class="header__burger-nav">
          <ul class="header__burger-nav-list">
            <li class="header__burger-nav-item">
              <a href="#about-us">About Us</a>
            </li>
            <li class="header__burger-nav-item">
              <a href="#services">Services</a>
            </li>
            <li class="header__burger-nav-item">
              <a href="#testimonials">Testimonials</a>
            </li>
            <li class="header__burger-nav-item">
              <a href="#contact-us">Contact Us</a>
            </li>
          </ul>
        </nav>
      </aside>
    </header>
    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
